<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f111f"/>
      <stop offset="55%" stop-color="#151827"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b2e"/>
      <stop offset="100%" stop-color="#10131f"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- banner background -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- pet face -->
  <rect x="70" y="58" width="280" height="244" rx="42" fill="url(#face)" stroke="#2a3047" stroke-width="2"/>
  <rect x="70" y="58" width="280" height="244" rx="42" fill="url(#scan)"/>

  <!-- status dot -->
  <circle cx="326" cy="86" r="8" fill="#22c55e"/>
  <circle cx="326" cy="86" r="12" fill="#22c55e" opacity="0.25"/>

  <!-- eyes (rounded rectangles, pure white, taller than wide) -->
  <rect x="128" y="138" width="56" height="72" rx="15" fill="url(#eye)"/>
  <rect x="236" y="138" width="56" height="72" rx="15" fill="url(#eye)"/>

  <!-- subtle eye inner glow -->
  <rect x="128" y="138" width="56" height="72" rx="15" fill="#ffffff" opacity="0.12"/>
  <rect x="236" y="138" width="56" height="72" rx="15" fill="#ffffff" opacity="0.12"/>

  <!-- wordmark -->
  <text x="416" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="1.5">HealthMate</text>
  <text x="420" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="3">PERSONAL HEALTHCARE AI COMPANION</text>

  <!-- tagline -->
  <text x="420" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b">Chat &#160;•&#160; Memory &#160;•&#160; Voice &#160;•&#160; Proactive Care</text>
</svg>
