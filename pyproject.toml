[project]
name = "healthmate"
version = "0.1.0"
description = "Personal Healthcare AI Agent — MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "python-multipart>=0.0.32",
    "zhconv>=1.4.3",
    "sqlalchemy>=2.0.51",
    "duckduckgo-search>=8.1.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "langchain-openai>=1.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app/"]
